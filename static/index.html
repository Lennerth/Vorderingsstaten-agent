<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Vorderingsstaat Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        .container { display: flex; gap: 20px; }
        .upload-section { flex: 1; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .preview-section { flex: 2; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }
        button.danger { background: #dc3545; padding: 5px 10px; font-size: 14px; margin-top: 0; }
        #status { margin-top: 10px; font-weight: bold; color: #666; }
        #markdown-content { white-space: pre-wrap; }
        img.preview { max-width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; }
        .tabs { margin-bottom: 10px; border-bottom: 1px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; display: inline-block; border: 1px solid transparent; border-bottom: none; }
        .tab.active { background: #fff; border-color: #ddd; border-bottom-color: #fff; font-weight: bold; margin-bottom: -1px; }
        pre { background: #eee; padding: 10px; overflow-x: auto; border-radius: 4px; }
        .camera-block { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 4px; background: #fafafa; }
        .camera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .camera-label-input { font-size: 16px; padding: 5px; width: 60%; }
        .form-control { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; }
        .options-section { border-top: 1px solid #eee; margin-top: 15px; padding-top: 15px; }
        .checkbox-list label { display: block; margin: 4px 0; }
        .spinner { font-style: italic; color: #666; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            line-height: 1.4;
        }
        .badge-high { background: #d4edda; color: #155724; }
        .badge-medium { background: #fff3cd; color: #856404; }
        .badge-low { background: #f8d7da; color: #721c24; }
        .warning-text { color: #856404; font-weight: 600; }
        .advanced-panel { margin-top: 10px; padding: 10px; border: 1px solid #eee; border-radius: 4px; background: #fff; }
        .advanced-panel.hidden { display: none; }
        .field-hint { font-size: 0.9em; color: #666; margin-top: 4px; }
        .track-mode { margin: 10px 0; }
        .track-mode label { margin-right: 15px; }
        .pair-inputs, .timelapse-inputs { margin-top: 10px; }
        .timelapse-inputs.hidden, .pair-inputs.hidden { display: none; }
        .extracted-frames { margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd; }
        .extracted-frames img { max-width: 120px; max-height: 90px; object-fit: cover; margin: 4px; border: 1px solid #ccc; border-radius: 4px; }
        .frame-thumb { display: inline-block; text-align: center; font-size: 0.75em; color: #666; }
        .progress-panel { margin-top: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
        .progress-panel.hidden { display: none; }
        .progress-step { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 0.95em; }
        .progress-step.pending { color: #999; }
        .progress-step.running { color: #007bff; font-weight: 600; }
        .progress-step.done { color: #155724; }
        .progress-step.error { color: #721c24; }
        .progress-elapsed { margin-top: 8px; font-size: 0.9em; color: #666; }
        .timings-summary { margin-top: 10px; font-size: 0.9em; color: #444; }
        .frame-count-row { margin-top: 8px; }
        .frame-count-row input { width: 80px; }
    </style>
</head>
<body>

<h1 data-i18n="pageTitle">Vorderingsstaat Generator</h1>

<div class="container">
    <div class="upload-section">
        <h3 data-i18n="uploadTitle">Upload Foto's</h3>
        <form id="uploadForm">
            <label for="regionSelect"><strong data-i18n="regionLabel">Regio / Région:</strong></label>
            <select id="regionSelect" class="form-control">
                <option value="flemish">Vlaams (bestek)</option>
                <option value="walloon">Wallon (CCTB)</option>
            </select>
            <br><br>
            <div id="camera-blocks"></div>
            <button type="button" id="addCameraBtn" class="secondary" data-i18n="addCamera">+ Camera toevoegen</button>
            <br><br>
            <div class="options-section">
                <label for="bestekpostFilter"><strong data-i18n="bestekpostFilter">Bestekpost filter (optioneel):</strong></label>
                <input
                    type="text"
                    id="bestekpostFilter"
                    class="form-control"
                    placeholder="01-03, 05.82-05.89, 10.20"
                    data-i18n-placeholder="filterPlaceholder"
                >

                <p style="margin-top: 15px;"><strong data-i18n="compressionTitle">Compressie:</strong></p>
                <label for="compressionPreset"><span data-i18n="compressionPresetLabel">Compressieniveau:</span></label>
                <select id="compressionPreset" class="form-control">
                    <option value="low" data-i18n="compressionLow">Laag (meer detail, groter bestand)</option>
                    <option value="medium" selected data-i18n="compressionMedium">Normaal</option>
                    <option value="high" data-i18n="compressionHigh">Hoog (kleiner bestand)</option>
                </select>
                <p class="field-hint" data-i18n="compressionHint">Normaal gebruikt de bestaande serverinstellingen.</p>

                <label style="display:block; margin-top: 10px;">
                    <input type="checkbox" id="compressionAdvanced">
                    <span data-i18n="compressionAdvanced">Geavanceerde instellingen</span>
                </label>
                <div id="compressionAdvancedPanel" class="advanced-panel hidden">
                    <label for="jpegQuality"><span data-i18n="jpegQualityLabel">JPEG kwaliteit (1-95):</span></label>
                    <input type="number" id="jpegQuality" class="form-control" min="1" max="95" step="1" value="85">
                    <label for="targetImageMb" style="margin-top: 10px; display:block;">
                        <span data-i18n="targetImageMbLabel">Doelgrootte per foto (MB):</span>
                    </label>
                    <input type="number" id="targetImageMb" class="form-control" min="0.2" max="10" step="0.1" value="2">
                </div>

                <p><strong data-i18n="reportFields">Rapportvelden:</strong></p>
                <div class="checkbox-list">
                    <label><input type="checkbox" class="report-field" value="zichtbaar_uitgevoerd" checked> <span data-i18n="fieldExecuted">Uitgevoerd in deze periode</span></label>
                    <label><input type="checkbox" class="report-field" value="bestekeisen" checked> <span data-i18n="fieldRequirements">Bestekeisen</span></label>
                    <label><input type="checkbox" class="report-field" value="bron" checked> <span data-i18n="fieldSource">Bron detailbestek</span></label>
                    <label><input type="checkbox" class="report-field" value="image_indices" checked> <span data-i18n="fieldPhotoIndices">Foto indices</span></label>
                    <label><input type="checkbox" class="report-field" value="camera_labels" checked> <span data-i18n="fieldCameraLabels">Camera labels</span></label>
                    <label><input type="checkbox" class="report-field" value="open_punten" checked> <span data-i18n="fieldOpenPoints">Open punten / risico's</span></label>
                    <label><input type="checkbox" class="report-field" value="volgende_stap" checked> <span data-i18n="fieldNextStep">Volgende stap</span></label>
                </div>
            </div>
            <br>
            <button type="submit" id="submitBtn" style="width: 100%; font-size: 18px; padding: 15px;" data-i18n="submit">Genereer Rapport</button>
        </form>
        <div id="status"></div>
        <div id="progress-panel" class="progress-panel hidden">
            <div id="progress-steps"></div>
            <div id="progress-elapsed" class="progress-elapsed"></div>
            <div id="timings-summary" class="timings-summary"></div>
        </div>
    </div>

    <div class="preview-section">
        <div class="tabs">
            <span class="tab active" onclick="switchTab('report')" data-i18n="reportTab">Rapport (Markdown)</span>
            <span class="tab" onclick="switchTab('json')" data-i18n="jsonTab">JSON Data</span>
        </div>
        
        <div id="report-view">
            <div id="markdown-render" data-state="empty"><em data-i18n="emptyResult">Het resultaat verschijnt hier...</em></div>
            <div id="extracted-frames-panel" class="extracted-frames" style="display:none;"></div>
        </div>
        
        <div id="json-view" style="display:none;">
            <pre id="json-content">{}</pre>
        </div>
    </div>
</div>

<template id="camera-block-template">
    <div class="camera-block">
        <div class="camera-header">
            <input type="text" class="camera-label-input" placeholder="Label (bijv. Camera 1)" data-i18n-placeholder="cameraPlaceholder" required>
            <button type="button" class="danger remove-camera-btn" data-i18n="removeCamera">Verwijder</button>
        </div>
        <div class="track-mode">
            <label><input type="radio" class="track-kind" name="" value="pair" checked> <span data-i18n="trackPair">Foto paar (voor/na)</span></label>
            <label><input type="radio" class="track-kind" name="" value="timelapse"> <span data-i18n="trackTimelapse">Timelapse video</span></label>
        </div>
        <div class="pair-inputs">
            <label><strong data-i18n="beforePhoto">Foto Voor (Eerder):</strong></label><br>
            <input type="file" class="before-file" accept="image/*"><br>
            <img class="preview before-preview"><br><br>
            <label><strong data-i18n="afterPhoto">Foto Na (Later):</strong></label><br>
            <input type="file" class="after-file" accept="image/*"><br>
            <img class="preview after-preview">
        </div>
        <div class="timelapse-inputs hidden">
            <label><strong data-i18n="timelapseVideo">Timelapse video:</strong></label><br>
            <input type="file" class="video-file" accept="video/mp4,video/quicktime"><br>
            <p class="field-hint video-meta"></p>
            <div class="frame-count-row">
                <label><span data-i18n="frameCountLabel">Aantal frames:</span></label>
                <input type="number" class="frame-count-input" min="2" max="16" step="1" value="8">
                <p class="field-hint" data-i18n="frameCountHint">Meer frames kunnen de verwerkingstijd en kosten verhogen.</p>
            </div>
            <img class="preview video-preview">
        </div>
    </div>
</template>

<script>

    let VIDEO_DEFAULT_FRAMES = 8;
    let VIDEO_MAX_FRAMES = 16;
    const STEP_ORDER = [

        'image_optimization',
        'agent1',
        'agent2',
        'report_generation',
    ];
    const UI_TEXT = {

            compressionMedium: 'Normaal',
            compressionHigh: 'Hoog (kleiner bestand)',

            compressionAdvanced: 'Geavanceerde instellingen',

            fieldRequirements: 'Bestekeisen',
            fieldSource: 'Bron detailbestek',
            fieldPhotoIndices: 'Foto indices',
            fieldCameraLabels: 'Camera labels',
            fieldOpenPoints: "Open punten / risico's",
            fieldNextStep: 'Volgende stap',
            submit: 'Genereer Rapport',
            reportTab: 'Rapport (Markdown)',

            emptyResult: 'Het resultaat verschijnt hier...',
            cameraPlaceholder: 'Label (bijv. Camera 1)',
            cameraDefault: 'Camera',

            beforePhoto: 'Foto Voor (Eerder):',
            afterPhoto: 'Foto Na (Later):',
            trackPair: 'Foto paar (voor/na)',
            trackTimelapse: 'Timelapse video',
            timelapseVideo: 'Timelapse video:',
            missingVideo: (label) => `Upload een timelapse video voor ${label}!`,
            extractedFramesTitle: 'Frames geëxtraheerd uit timelapsevideo',
            maxCameras: (max) => `Maximaal ${max} camera's toegestaan.`,
            missingPhotos: (label) => `Upload beide foto's voor ${label}!`,

            elapsedLabel: 'Verstreken tijd:',

            stepAgent2: 'Agent 2 – verrijking',

        },
        walloon: {
            pageTitle: "Générateur d'état d'avancement",
            uploadTitle: 'Télécharger photos / timelapses',
            regionLabel: 'Région:',
            addCamera: '+ Ajouter une caméra',
            bestekpostFilter: 'Filtre poste CCTB (optionnel):',
            filterPlaceholder: 'T1.11-T1.19, T2.21, T6',
            compressionTitle: 'Compression :',
            compressionPresetLabel: 'Niveau de compression :',
            compressionLow: 'Faible (plus de détail, fichier plus grand)',
            compressionMedium: 'Normal',
            compressionHigh: 'Élevée (fichier plus petit)',
            compressionHint: 'Normal utilise les paramètres serveur existants.',
            compressionAdvanced: 'Paramètres avancés',
            jpegQualityLabel: 'Qualité JPEG (1-95) :',
            targetImageMbLabel: 'Taille cible par photo (Mo) :',
            reportFields: 'Champs du rapport:',
            fieldExecuted: 'Réalisé sur la période',
            fieldRequirements: 'Exigences CCTB',
            fieldSource: 'Source CCTB détaillée',
            fieldPhotoIndices: 'Indices des photos',
            fieldCameraLabels: 'Libellés caméra',
            fieldOpenPoints: 'Points ouverts / risques',
            fieldNextStep: 'Prochaine étape',
            submit: 'Générer le rapport',
            reportTab: 'Rapport (Markdown)',
            jsonTab: 'Données JSON',
            emptyResult: 'Le résultat apparaîtra ici...',
            cameraPlaceholder: 'Libellé (p. ex. Caméra 1)',
            cameraDefault: 'Caméra',
            removeCamera: 'Supprimer',
            beforePhoto: 'Photo avant:',
            afterPhoto: 'Photo après:',
            trackPair: 'Paire de photos (avant/après)',
            trackTimelapse: 'Vidéo timelapse',
            timelapseVideo: 'Vidéo timelapse :',
            missingVideo: (label) => `Téléchargez une vidéo timelapse pour ${label} !`,
            extractedFramesTitle: 'Images extraites de la vidéo timelapse',
            maxCameras: (max) => `${max} caméras maximum autorisées.`,
            missingPhotos: (label) => `Téléchargez les deux photos pour ${label} !`,
            processing: 'Traitement en cours... cela peut prendre plusieurs minutes.',
            loading: 'Chargement...',
            done: 'Terminé !',
            errorPrefix: 'Erreur : ',
            genericError: "Une erreur s'est produite.",
            frameCountLabel: "Nombre d'images :",
            frameCountHint: "Plus d'images peuvent augmenter le temps de traitement et le coût.",
            elapsedLabel: 'Temps écoulé :',
            timingsTitle: 'Durée par étape :',
            stepUploadValidation: 'Validation du téléversement',
            stepVideoExtraction: 'Extraction des images vidéo',
            stepImageOptimization: 'Optimisation des images',
            stepAgent1: 'Agent 1 – analyse',
            stepAgent2: 'Agent 2 – enrichissement',
            stepReportGeneration: 'Génération du rapport',
            stepPending: 'en attente',
            stepRunning: 'en cours',
            stepDone: 'terminé',
            stepError: 'erreur',
        },
    };

    let cameraCount = 0;

    function currentRegion() {
        return document.getElementById('regionSelect').value || 'flemish';
    }

    function t(key, region = currentRegion()) {
        return UI_TEXT[region][key] || UI_TEXT.flemish[key] || key;
    }

    function applyLanguage(region = currentRegion(), root = document) {
        document.documentElement.lang = region === 'walloon' ? 'fr' : 'nl';
        document.title = t('pageTitle', region);

        root.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.dataset.i18n;
            element.textContent = t(key, region);
        });

        root.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
            const key = element.dataset.i18nPlaceholder;
            element.placeholder = t(key, region);
        });

        const presetSelect = document.getElementById('compressionPreset');
        if (presetSelect) {
            presetSelect.querySelectorAll('option[data-i18n]').forEach(option => {
                option.textContent = t(option.dataset.i18n, region);
            });
        }
    }

    function updateCompressionAdvancedPanel() {
        const advancedCheckbox = document.getElementById('compressionAdvanced');
        const panel = document.getElementById('compressionAdvancedPanel');
        const presetSelect = document.getElementById('compressionPreset');
        if (!advancedCheckbox || !panel) {
            return;
        }
        const enabled = advancedCheckbox.checked;
        panel.classList.toggle('hidden', !enabled);
        if (presetSelect) {
            presetSelect.disabled = enabled;
        }
    }

    function appendCompressionFields(formData) {
        const presetSelect = document.getElementById('compressionPreset');
        const advancedCheckbox = document.getElementById('compressionAdvanced');
        if (!presetSelect || !advancedCheckbox) {
            return;
        }

        formData.append('compression_preset', presetSelect.value);
        const advancedEnabled = advancedCheckbox.checked;
        formData.append('compression_advanced', advancedEnabled ? 'true' : 'false');
        if (advancedEnabled) {
            formData.append('jpeg_quality', document.getElementById('jpegQuality').value);
            formData.append('target_image_mb', document.getElementById('targetImageMb').value);
        }
    }

    function checkRequiredUiElements() {
        const requiredIds = [
            'uploadForm',
            'camera-blocks',
            'addCameraBtn',
            'submitBtn',
            'compressionPreset',
            'compressionAdvanced',
            'compressionAdvancedPanel',
        ];
        const missing = requiredIds.filter(id => !document.getElementById(id));
        if (missing.length > 0) {
            console.warn('Missing UI elements:', missing.join(', '));
        }
    }

    function setupVideoPreview(inputElement, imgElement, metaElement) {
        inputElement.addEventListener('change', () => {
            const file = inputElement.files[0];
            if (!file) {
                imgElement.style.display = 'none';
                imgElement.src = '';
                metaElement.textContent = '';
                return;
            }
            metaElement.textContent = `${file.name} (${(file.size / (1024 * 1024)).toFixed(1)} MB)`;
            const url = URL.createObjectURL(file);
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.src = url;
            video.onloadeddata = () => {
                video.currentTime = Math.min(1, video.duration / 2 || 0);
            };
            video.onseeked = () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                imgElement.src = canvas.toDataURL('image/jpeg');
                imgElement.style.display = 'block';
                URL.revokeObjectURL(url);
            };
        });
    }

    function setupTrackMode(block) {
        const radios = block.querySelectorAll('.track-kind');
        const pairInputs = block.querySelector('.pair-inputs');
        const timelapseInputs = block.querySelector('.timelapse-inputs');
        const updateMode = () => {
            const selected = block.querySelector('.track-kind:checked')?.value || 'pair';
            pairInputs.classList.toggle('hidden', selected !== 'pair');
            timelapseInputs.classList.toggle('hidden', selected !== 'timelapse');
        };
        radios.forEach(radio => radio.addEventListener('change', updateMode));
        updateMode();
    }

    function getTrackKind(block) {
        return block.querySelector('.track-kind:checked')?.value || 'pair';
    }

    function renderExtractedFrames(data, region) {
        const panel = document.getElementById('extracted-frames-panel');
        const frames = data.extracted_frames || [];
        if (!frames.length) {
            panel.style.display = 'none';
            panel.innerHTML = '';
            return;
        }
        panel.style.display = 'block';
        let html = `<h4>${t('extractedFramesTitle', region)}</h4>`;
        frames.forEach(track => {
            html += `<p><strong>${track.camera_label}</strong></p><div>`;
            (track.frames || []).forEach(frame => {
                html += `<span class="frame-thumb"><img src="${frame.data_url}" alt="t=${frame.timestamp_s}s"><br>t=${frame.timestamp_s}s</span>`;
            });
            html += '</div>';
        });
        panel.innerHTML = html;
    }

    function formatDurationMmSs(totalSeconds) {
        const total = Math.max(0, Math.round(totalSeconds));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function stepLabel(stepId, region = currentRegion()) {
        const map = {
            upload_validation: 'stepUploadValidation',
            video_extraction: 'stepVideoExtraction',
            image_optimization: 'stepImageOptimization',
            agent1: 'stepAgent1',
            agent2: 'stepAgent2',
            report_generation: 'stepReportGeneration',
        };
        return t(map[stepId] || stepId, region);
    }

    function statusLabel(status, region = currentRegion()) {
        const map = {
            pending: 'stepPending',
            running: 'stepRunning',
            done: 'stepDone',
            error: 'stepError',
        };
        return t(map[status] || status, region);
    }

    function renderProgressSteps(steps, region = currentRegion()) {
        const container = document.getElementById('progress-steps');
        if (!container) return;
        const stepMap = Object.fromEntries((steps || []).map(step => [step.id, step]));
        container.innerHTML = STEP_ORDER.map(stepId => {
            const step = stepMap[stepId] || { id: stepId, status: 'pending' };
            const duration = step.duration_display ? ` (${step.duration_display})` : '';
            const elapsed = step.elapsed_display ? ` (${step.elapsed_display})` : '';
            const suffix = step.status === 'done' ? duration : (step.status === 'running' ? elapsed : '');
            return `<div class="progress-step ${step.status}"><span>${stepLabel(stepId, region)}</span><span>${statusLabel(step.status, region)}${suffix}</span></div>`;
        }).join('');
    }

    function showProgressPanel(region = currentRegion()) {
        const panel = document.getElementById('progress-panel');
        if (!panel) return;
        panel.classList.remove('hidden');
        renderProgressSteps(
            STEP_ORDER.map(stepId => ({ id: stepId, status: 'pending' })),
            region,
        );
        document.getElementById('timings-summary').textContent = '';
    }

    function hideProgressPanel() {
        const panel = document.getElementById('progress-panel');
        if (panel) panel.classList.add('hidden');
    }

    function renderTimingsSummary(data, region = currentRegion()) {
        const summary = document.getElementById('timings-summary');
        if (!summary || !data.timings_display) return;
        const parts = Object.entries(data.timings_display).map(
            ([label, value]) => `${label}: ${value}`,
        );
        summary.textContent = `${t('timingsTitle', region)} ${parts.join(' · ')}`;
    }

    function applyVideoFrameConfig(root = document) {
        root.querySelectorAll('.frame-count-input').forEach(input => {
            input.min = 2;
            input.max = VIDEO_MAX_FRAMES;
            if (!input.dataset.userEdited) {
                input.value = VIDEO_DEFAULT_FRAMES;
            }
        });
    }

    async function pollProgress(requestId, region, onTick) {
        while (true) {
            const response = await fetch(`/progress/${requestId}`);
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || 'Progress polling failed');
            }
            const progress = await response.json();
            renderProgressSteps(progress.steps || [], region);
            if (typeof onTick === 'function') {
                onTick(progress);
            }
            if (progress.status === 'complete') {
                return progress.result;
            }
            if (progress.status === 'error') {
                throw new Error(progress.error || t('genericError', region));
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
    }

    async function loadServerConfig() {
        try {
            const response = await fetch('/config');
            if (response.ok) {
                const cfg = await response.json();
                if (cfg.max_cameras) {
                    MAX_CAMERAS = cfg.max_cameras;
                }
                if (cfg.video_default_frames) {
                    VIDEO_DEFAULT_FRAMES = cfg.video_default_frames;
                }
                if (cfg.video_max_frames) {
                    VIDEO_MAX_FRAMES = cfg.video_max_frames;
                }
                applyVideoFrameConfig();
            }
        } catch (error) {
            console.warn('Could not load server config', error);
        }
    }
    function setupPreview(inputElement, imgElement) {
        inputElement.addEventListener('change', () => {
            const file = inputElement.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                imgElement.style.display = 'none';
                imgElement.src = '';
            }
        });
    }

    function addCameraBlock() {
        const blocksContainer = document.getElementById('camera-blocks');
        const currentBlocks = blocksContainer.querySelectorAll('.camera-block').length;
        const region = currentRegion();
        
        if (currentBlocks >= MAX_CAMERAS) {
            alert(t('maxCameras', region)(MAX_CAMERAS));
            return;
        }

        cameraCount++;
        const template = document.getElementById('camera-block-template');
        const clone = template.content.cloneNode(true);
        const block = clone.querySelector('.camera-block');
        
        const labelInput = block.querySelector('.camera-label-input');
        labelInput.value = `${t('cameraDefault', region)} ${cameraCount}`;
        labelInput.dataset.autoLabel = 'true';
        labelInput.addEventListener('input', () => {
            delete labelInput.dataset.autoLabel;
        });

        const radioName = `track-kind-${cameraCount}`;
        block.querySelectorAll('.track-kind').forEach(radio => {
            radio.name = radioName;
        });

        setupPreview(block.querySelector('.before-file'), block.querySelector('.before-preview'));
        setupPreview(block.querySelector('.after-file'), block.querySelector('.after-preview'));
        setupVideoPreview(
            block.querySelector('.video-file'),
            block.querySelector('.video-preview'),
            block.querySelector('.video-meta'),
        );
        setupTrackMode(block);

        const frameCountInput = block.querySelector('.frame-count-input');
        if (frameCountInput) {
            frameCountInput.addEventListener('input', () => {
                frameCountInput.dataset.userEdited = 'true';
            });
            applyVideoFrameConfig(block);
        }

        const removeBtn = block.querySelector('.remove-camera-btn');
        removeBtn.addEventListener('click', () => {
            if (blocksContainer.querySelectorAll('.camera-block').length > 1) {
                block.remove();
                updateRemoveButtons();
                updateAddButton();
            }
        });

        blocksContainer.appendChild(block);
        applyLanguage(region, block);
        updateRemoveButtons();
        updateAddButton();
    }

    function updateRemoveButtons() {
        const blocks = document.querySelectorAll('.camera-block');
        blocks.forEach(block => {
            const removeBtn = block.querySelector('.remove-camera-btn');
            removeBtn.disabled = blocks.length <= 1;
        });
    }

    function updateAddButton() {
        const blocks = document.querySelectorAll('.camera-block');
        const addBtn = document.getElementById('addCameraBtn');
        addBtn.disabled = blocks.length >= MAX_CAMERAS;
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        
        if (tabName === 'report') {
            document.getElementById('report-view').style.display = 'block';
            document.getElementById('json-view').style.display = 'none';
        } else {
            document.getElementById('report-view').style.display = 'none';
            document.getElementById('json-view').style.display = 'block';
        }
    }

    function updateAutoCameraLabels(region = currentRegion()) {
        document.querySelectorAll('.camera-label-input[data-auto-label="true"]').forEach((input, index) => {
            input.value = `${t('cameraDefault', region)} ${index + 1}`;
        });
    }

    // Initialize
    loadServerConfig().then(() => {
        addCameraBlock();
        applyLanguage();
        checkRequiredUiElements();
        updateCompressionAdvancedPanel();
    });

    document.getElementById('addCameraBtn').addEventListener('click', addCameraBlock);
    const compressionAdvanced = document.getElementById('compressionAdvanced');
    if (compressionAdvanced) {
        compressionAdvanced.addEventListener('change', updateCompressionAdvancedPanel);
    }
    document.getElementById('regionSelect').addEventListener('change', () => {
        const region = currentRegion();
        applyLanguage(region);
        updateAutoCameraLabels(region);
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const blocks = document.querySelectorAll('.camera-block');
        if (blocks.length === 0) return;
        const region = currentRegion();
        
        if (blocks.length > MAX_CAMERAS) {
            alert(t('maxCameras', region)(MAX_CAMERAS));
            return;
        }

        const formData = new FormData();
        const pairLabels = [];
        const videoLabels = [];
        const videoFrameCounts = [];
        const trackOrder = [];

        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            const label = block.querySelector('.camera-label-input').value.trim() || `${t('cameraDefault', region)} ${i + 1}`;
            const kind = getTrackKind(block);
            trackOrder.push(kind);

            if (kind === 'pair') {
                const beforeFile = block.querySelector('.before-file').files[0];
                const afterFile = block.querySelector('.after-file').files[0];
                if (!beforeFile || !afterFile) {
                    alert(t('missingPhotos', region)(label));
                    return;
                }
                formData.append('before_images', beforeFile);
                formData.append('after_images', afterFile);
                pairLabels.push(label);
            } else if (kind === 'timelapse') {
                const videoFile = block.querySelector('.video-file').files[0];
                if (!videoFile) {
                    alert(t('missingVideo', region)(label));
                    return;
                }
                const frameCountInput = block.querySelector('.frame-count-input');
                const frameCount = parseInt(frameCountInput?.value || VIDEO_DEFAULT_FRAMES, 10);
                if (Number.isNaN(frameCount) || frameCount < 2 || frameCount > VIDEO_MAX_FRAMES) {
                    alert(`${t('frameCountLabel', region)} 2-${VIDEO_MAX_FRAMES}`);
                    return;
                }
                formData.append('videos', videoFile);
                videoLabels.push(label);
                videoFrameCounts.push(frameCount);
            }
        }

        formData.append('camera_labels', JSON.stringify(pairLabels));
        formData.append('video_labels', JSON.stringify(videoLabels));
        formData.append('video_frame_counts', JSON.stringify(videoFrameCounts));
        formData.append('track_order', JSON.stringify(trackOrder));
        formData.append('region', region);
        const bestekpostFilter = document.getElementById('bestekpostFilter').value.trim();
        if (bestekpostFilter) {
            formData.append('bestekpost_filter', bestekpostFilter);
        }

        const reportFields = Array.from(document.querySelectorAll('.report-field:checked'))
            .map(checkbox => checkbox.value);
        formData.append('report_fields', JSON.stringify(reportFields));

        appendCompressionFields(formData);

        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const addBtn = document.getElementById('addCameraBtn');

        submitBtn.disabled = true;
        addBtn.disabled = true;
        
        // Disable remove buttons during upload
        document.querySelectorAll('.remove-camera-btn').forEach(btn => btn.disabled = true);
        
        statusDiv.textContent = t('processing', region);
        showProgressPanel(region);
        document.getElementById('markdown-render').dataset.state = 'loading';
        document.getElementById('markdown-render').innerHTML = `<div class="spinner">${t('loading', region)}</div>`;
        const framesPanel = document.getElementById('extracted-frames-panel');
        framesPanel.style.display = 'none';
        framesPanel.innerHTML = '';

        const elapsedDiv = document.getElementById('progress-elapsed');
        const startedAt = Date.now();
        const elapsedTimer = setInterval(() => {
            const elapsedSeconds = (Date.now() - startedAt) / 1000;
            elapsedDiv.textContent = `${t('elapsedLabel', region)} ${formatDurationMmSs(elapsedSeconds)}`;
        }, 1000);
        elapsedDiv.textContent = `${t('elapsedLabel', region)} 0:00`;

        try {
            const response = await fetch('/progress-report/jobs', {
                method: 'POST',
                body: formData
            });

            if (response.status === 409) {
                const err = await response.json();
                throw new Error(err.detail || 'Another job is running');
            }

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || 'Server error');
            }

            const job = await response.json();
            const data = await pollProgress(job.request_id, region);

            document.getElementById('markdown-render').dataset.state = 'result';
            document.getElementById('markdown-render').innerHTML = marked.parse(data.markdown_report);
            renderExtractedFrames(data, region);
            document.getElementById('json-content').textContent = JSON.stringify(data, null, 2);
            renderTimingsSummary(data, region);
            statusDiv.textContent = t('done', region);
        } catch (error) {
            console.error(error);
            statusDiv.textContent = t('errorPrefix', region) + error.message;
            document.getElementById('markdown-render').dataset.state = 'error';
            document.getElementById('markdown-render').innerHTML = `<span style="color:red">${t('genericError', region)}</span>`;
        } finally {
            clearInterval(elapsedTimer);
            submitBtn.disabled = false;
            updateAddButton();
            updateRemoveButtons();
        }
    });
</script>

</body>
</html>
